server:
  port: 2310
  tomcat:
    uri-encoding: UTF-8

logging:
  config: classpath:logback.xml

spring:
  # 建表责任迁到 cluster-admin；iot-access 不再跑 Flyway，避免版本不同步
  flyway:
    enabled: false

  thymeleaf:
    # iot-access 不再承载页面，关闭避免自动装配
    cache: false
    check-template-location: false
    enabled: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: jdbc:postgresql://localhost:5432/iot_access_hub?stringtype=unspecified
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

# ============ MyBatis-Plus ============
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.cas.access.netty.entity
  configuration:
    map-underscore-to-camel-case: true
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

netty:
  server:
    protocol:
      # 协议 jar 扫描目录（建议放在项目外部，避免 IDE 监控/索引锁定 jar 文件）
      jar-dir: /netty-protocols
      # 启动时是否自动扫描一次外部协议 jar
      auto-load-on-startup: true

# ============ RocketMQ ============
rocketmq:
  # gRPC 端点（RocketMQ 5.x Proxy 默认端口 8081）
  endpoint: 127.0.0.1:8081
  namesrvAddr: 127.0.0.1:9876
  dashboard:
    url: http://127.0.0.1:8082  # 确保这里是你 Dashboard 真实的访问地址
  broker:
    name: broker-default        # 请打开 Dashboard 的 Cluster 页面，确认你的 Broker Name 是什么，填在这里
  cluster:
    name: DefaultCluster
  producer:
    group: netty-server-bridge
    # 未绑定 topic 的端口数据是否丢弃（true=丢弃，false=抛异常）
    send-message-timeout: 3000
