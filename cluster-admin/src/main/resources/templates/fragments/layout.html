<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- ============ head 片段 ============
     参数：title（页面标题）
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · 物联网管理中心'">物联网管理中心</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<!-- ============ 左侧菜单 ============
     参数：active（当前激活菜单的 key）
-->
<aside th:fragment="sidebar(active)" class="sidebar">
    <div class="brand">
        <div class="brand-logo"><i class="bi bi-diagram-3"></i></div>
        <div>
            <div class="brand-title">物联网管理中心</div>
        </div>
    </div>

    <nav class="menu">
        <div class="menu-group-label">监控</div>
        <a class="menu-item" th:href="@{/}" th:classappend="${active == 'dashboard'} ? 'active' : ''">
            <i class="bi bi-speedometer2"></i><span>概览</span>
        </a>
        <a class="menu-item" th:href="@{/traffic}" th:classappend="${active == 'traffic'} ? 'active' : ''">
            <i class="bi bi-graph-up-arrow"></i><span>流量监控</span>
            <span class="menu-badge">Soon</span>
        </a>

        <div class="menu-group-label">接入</div>
        <a class="menu-item" th:href="@{/connections}" th:classappend="${active == 'connections'} ? 'active' : ''">
            <i class="bi bi-people"></i><span>连接管理</span>
            <span class="menu-badge">Soon</span>
        </a>
        <a class="menu-item" th:href="@{/ports}" th:classappend="${active == 'ports'} ? 'active' : ''">
            <i class="bi bi-plug"></i><span>端口管理</span>
            <span class="menu-badge">Soon</span>
        </a>

        <div class="menu-group-label">配置</div>
        <a class="menu-item" th:href="@{/protocols-page}" th:classappend="${active == 'protocols'} ? 'active' : ''">
            <i class="bi bi-box-seam"></i><span>协议热插拔</span>
        </a>
        <a class="menu-item" th:href="@{/port-topics-page}" th:classappend="${active == 'port-topics'} ? 'active' : ''">
            <i class="bi bi-share"></i><span>数据桥接管理</span>
        </a>

        <div class="menu-group-label">日志</div>
        <a class="menu-item" th:href="@{/bridge-logs-page}" th:classappend="${active == 'bridge-logs'} ? 'active' : ''">
            <i class="bi bi-journal-text"></i><span>数据桥接日志</span>
        </a>
        <a class="menu-item" th:href="@{/logs}" th:classappend="${active == 'logs'} ? 'active' : ''">
            <i class="bi bi-terminal"></i><span>系统日志</span>
        </a>

        <div class="menu-group-label">集群</div>
        <a class="menu-item" th:href="@{/nodes-page}" th:classappend="${active == 'nodes'} ? 'active' : ''">
            <i class="bi bi-hdd-network"></i><span>节点管理</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <span>v1.0</span>
        <span class="version-pill">:2312</span>
    </div>
</aside>

<!-- ============ Toast 容器 ============-->
<div th:fragment="toasts" class="toast-container" id="toast-container"></div>

<!-- ============ 通用确认弹窗 ============-->
<div th:fragment="confirm-modal" id="confirm-modal" class="modal-mask hidden">
    <div class="modal-box" style="width:400px;">
        <div class="modal-head">
            <h3><i class="bi bi-exclamation-triangle" id="confirm-icon"></i> <span id="confirm-title">确认操作</span></h3>
            <button class="modal-close" onclick="hideConfirm()" aria-label="关闭">&times;</button>
        </div>
        <div style="padding:20px;">
            <div id="confirm-message" style="font-size:13px; color:var(--text-soft); line-height:1.6; white-space:pre-wrap;"></div>
        </div>
        <div style="padding:0 20px 16px; display:flex; justify-content:flex-end; gap:8px;">
            <button class="btn btn-sm btn-ghost" onclick="hideConfirm()">取消</button>
            <button class="btn btn-sm btn-primary" id="confirm-ok-btn">确定</button>
        </div>
    </div>
</div>

<!-- ============ 公共脚本 ============-->
<th:block th:fragment="scripts">
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
