<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('数据桥接日志')"></head>
<body>

<header class="topbar">
    <div class="topbar-left">
        <div>
            <div class="page-title">数据桥接日志</div>
        </div>
    </div>
    <div class="topbar-right">
        <button class="btn btn-warning-ghost btn-sm" onclick="batchResend()">
            <i class="bi bi-arrow-repeat"></i> 一键重投递
        </button>
        <button class="btn btn-ghost btn-sm" onclick="loadData()">
            <i class="bi bi-refresh"></i> 刷新
        </button>
    </div>
</header>

<aside th:replace="fragments/layout :: sidebar('bridge-logs')"></aside>

<main class="content">

    <!-- 统计卡片 -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon-bg icon-blue"><i class="bi bi-journal-text"></i></div>
            <div class="stat-label">日志总数</div>
            <div class="stat-value" id="stat-total">-</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon-bg icon-green"><i class="bi bi-check-circle"></i></div>
            <div class="stat-label">成功</div>
            <div class="stat-value" id="stat-success">-</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon-bg icon-red"><i class="bi bi-x-circle"></i></div>
            <div class="stat-label">失败</div>
            <div class="stat-value" id="stat-failure">-</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon-bg icon-purple"><i class="bi bi-percent"></i></div>
            <div class="stat-label">成功率</div>
            <div class="stat-value" id="stat-rate">-</div>
        </div>
    </div>

    <!-- 日志列表 -->
    <div class="panel">
        <div class="panel-header">
            <div class="panel-title">
                <i class="bi bi-list-ul"></i> 桥接日志明细
            </div>
            <div style="display:flex; gap:8px; align-items:center;">
                <select id="filter-port" class="form-control" style="width:140px; font-size:12px; padding:4px 8px;" onchange="onFilterChange()">
                    <option value="">全部端口</option>
                </select>
                <select id="filter-success" class="form-control" style="width:120px; font-size:12px; padding:4px 8px;" onchange="onFilterChange()">
                    <option value="">全部状态</option>
                    <option value="true">成功</option>
                    <option value="false">失败</option>
                </select>
            </div>
        </div>
        <div class="panel-body">
            <div id="empty-tip" class="empty" style="display:none;">
                <i class="bi bi-inbox"></i>
                暂无日志记录
            </div>
            <table id="log-table" style="display:none;">
                <thead>
                <tr>
                    <th style="width:40px;"><input type="checkbox" id="check-all" onchange="toggleAll(this)"></th>
                    <th>ID</th>
                    <th>服务端</th>
                    <th>客户端</th>
                    <th>Topic</th>
                    <th>状态</th>
                    <th>重投递次数</th>
                    <th>耗时</th>
                    <th>时间</th>
                    <th class="text-right">操作</th>
                </tr>
                </thead>
                <tbody id="log-tbody"></tbody>
            </table>
        </div>
        <!-- 分页 -->
        <div id="pagination" style="display:none; padding:12px 18px; border-top:1px solid var(--border); justify-content:space-between; align-items:center;">
            <div style="font-size:12px; color:var(--text-muted);" id="page-info"></div>
            <div style="display:flex; gap:4px;" id="page-btns"></div>
        </div>
    </div>

</main>

<!-- 详情 Modal -->
<div id="detail-modal" class="modal-mask hidden">
    <div class="modal-box" style="width:640px;">
        <div class="modal-head">
            <h3><i class="bi bi-info-circle"></i> 桥接日志详情</h3>
            <button class="modal-close" onclick="closeDetailModal()" aria-label="关闭">&times;</button>
        </div>
        <div style="padding:18px 20px;">
            <div id="detail-content"></div>
        </div>
    </div>
</div>

<div th:replace="fragments/layout :: toasts"></div>
<th:block th:replace="fragments/layout :: scripts"></th:block>

<script>
    var currentPage = 1;
    var pageSize = 20;
    var totalPages = 1;

    function refresh() {
        loadData();
    }

    document.addEventListener('DOMContentLoaded', function () {
        loadStats();
        loadPorts();
        loadData();
        document.getElementById('detail-modal').addEventListener('click', function (e) {
            if (e.target === this) closeDetailModal();
        });
    });

    /* ========== 统计 ========== */
    function loadStats() {
        fetch('/bridge-logs/stats')
            .then(function (r) { return r.json(); })
            .then(function (j) {
                if (j.success) {
                    document.getElementById('stat-total').textContent = j.total;
                    document.getElementById('stat-success').textContent = j.successCount;
                    document.getElementById('stat-failure').textContent = j.failureCount;
                    document.getElementById('stat-rate').textContent = j.successRate + '%';
                }
            });
    }

    /* ========== 端口筛选 ========== */
    function loadPorts() {
        fetch('/port-topics')
            .then(function (r) { return r.json(); })
            .then(function (j) {
                if (j.success) {
                    var select = document.getElementById('filter-port');
                    var current = select.value;
                    var html = '<option value="">全部端口</option>';
                    var ports = j.data || [];
                    var seen = {};
                    for (var i = 0; i < ports.length; i++) {
                        var p = ports[i].port;
                        if (!seen[p]) {
                            seen[p] = true;
                            html += '<option value="' + p + '">' + p + '</option>';
                        }
                    }
                    select.innerHTML = html;
                    select.value = current;
                }
            });
    }

    /* ========== 数据加载 ========== */
    function onFilterChange() {
        currentPage = 1;
        loadData();
    }

    function loadData() {
        var port = document.getElementById('filter-port').value;
        var success = document.getElementById('filter-success').value;
        var url = '/bridge-logs?page=' + currentPage + '&size=' + pageSize;
        if (port) url += '&serverPort=' + encodeURIComponent(port);
        if (success) url += '&success=' + encodeURIComponent(success);

        fetch(url)
            .then(function (r) { return r.json(); })
            .then(function (j) {
                if (j.success) {
                    renderTable(j.data || []);
                    renderPagination(j.total, j.pages, j.current);
                } else {
                    showToast(j.reason || '加载失败', 'error');
                }
            })
            .catch(function (err) {
                showToast('请求异常: ' + err.message, 'error');
            });
    }

    function renderTable(data) {
        var tbody = document.getElementById('log-tbody');
        var emptyTip = document.getElementById('empty-tip');
        var table = document.getElementById('log-table');

        if (data.length === 0) {
            table.style.display = 'none';
            emptyTip.style.display = 'block';
            return;
        }
        table.style.display = '';
        emptyTip.style.display = 'none';

        var html = '';
        for (var i = 0; i < data.length; i++) {
            var r = data[i];
            var addrS = (r.serverIp || '-') + ':' + r.serverPort;
            var addrC = (r.clientIp || '-') + ':' + r.clientPort;
            var statusTag = r.success
                ? '<span class="tag tag-active"><i class="bi bi-check-circle-fill" style="font-size:10px;"></i> 成功</span>'
                : '<span class="tag tag-warn"><i class="bi bi-x-circle-fill" style="font-size:10px;"></i> 失败</span>';
            var topic = r.topicName ? '<span class="mono">' + esc(r.topicName) + '</span>' : '<span class="text-muted">-</span>';
            var cost = r.costMs != null ? r.costMs + 'ms' : '-';

            html += '<tr>'
                + '<td><input type="checkbox" class="row-check" value="' + r.id + '"></td>'
                + '<td><span class="code-chip">' + r.id + '</span></td>'
                + '<td><span class="mono">' + esc(addrS) + '</span></td>'
                + '<td><span class="mono">' + esc(addrC) + '</span></td>'
                + '<td>' + topic + '</td>'
                + '<td>' + statusTag + '</td>'
                + '<td>' + r.retryCount + '</td>'
                + '<td>' + cost + '</td>'
                + '<td><span class="mono text-muted" style="font-size:11px;">' + esc(r.createdAt) + '</span></td>'
                + '<td class="text-right">'
                + '<button class="btn btn-sm btn-primary-ghost" onclick="showDetail(' + r.id + ')">'
                + '<i class="bi bi-eye"></i> 详情</button> '
                + (r.success ? '' :
                '<button class="btn btn-sm btn-warning-ghost" onclick="resendLog(' + r.id + ')">'
                + '<i class="bi bi-arrow-repeat"></i> 重投递</button> ')
                + '<button class="btn btn-sm btn-danger-ghost" onclick="deleteLog(' + r.id + ')">'
                + '<i class="bi bi-trash3"></i></button>'
                + '</td>'
                + '</tr>';
        }
        tbody.innerHTML = html;
    }

    function renderPagination(total, pages, current) {
        var info = document.getElementById('page-info');
        var btns = document.getElementById('page-btns');
        var pag = document.getElementById('pagination');

        if (total === 0) {
            pag.style.display = 'none';
            return;
        }
        pag.style.display = 'flex';
        totalPages = pages;
        currentPage = current;

        info.textContent = '共 ' + total + ' 条，第 ' + current + '/' + pages + ' 页';

        var html = '';
        if (current > 1) {
            html += '<button class="btn btn-sm btn-ghost" onclick="goPage(' + (current - 1) + ')"><i class="bi bi-chevron-left"></i></button>';
        }
        var start = Math.max(1, current - 2);
        var end = Math.min(pages, current + 2);
        for (var p = start; p <= end; p++) {
            if (p === current) {
                html += '<button class="btn btn-sm btn-primary" disabled>' + p + '</button>';
            } else {
                html += '<button class="btn btn-sm btn-ghost" onclick="goPage(' + p + ')">' + p + '</button>';
            }
        }
        if (current < pages) {
            html += '<button class="btn btn-sm btn-ghost" onclick="goPage(' + (current + 1) + ')"><i class="bi bi-chevron-right"></i></button>';
        }
        btns.innerHTML = html;
    }

    function goPage(p) {
        currentPage = p;
        loadData();
    }

    /* ========== 全选 ========== */
    function toggleAll(el) {
        var checks = document.querySelectorAll('.row-check');
        for (var i = 0; i < checks.length; i++) {
            checks[i].checked = el.checked;
        }
    }

    function getSelectedIds() {
        var ids = [];
        var checks = document.querySelectorAll('.row-check:checked');
        for (var i = 0; i < checks.length; i++) {
            ids.push(checks[i].value);
        }
        return ids;
    }

    /* ========== 详情 ========== */
    function showDetail(id) {
        fetch('/bridge-logs/' + id)
            .then(function (r) { return r.json(); })
            .then(function (j) {
                if (!j.success) {
                    showToast(j.reason || '加载失败', 'error');
                    return;
                }
                var d = j.data;
                var successTag = d.success
                    ? '<span class="tag tag-active">成功</span>'
                    : '<span class="tag tag-warn">失败</span>';
                var rawHtml = d.rawData
                    ? '<pre style="background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:12px; font-size:12px; overflow-x:auto; max-height:200px; margin:0; white-space:pre-wrap; word-break:break-all;">' + esc(d.rawData) + '</pre>'
                    : '<span class="text-muted">-</span>';
                var errorHtml = d.errorMsg
                    ? '<pre style="background:var(--danger-soft); border:1px solid var(--danger); border-radius:6px; padding:12px; font-size:12px; overflow-x:auto; max-height:150px; margin:0; color:var(--danger); white-space:pre-wrap; word-break:break-all;">' + esc(d.errorMsg) + '</pre>'
                    : '<span class="text-muted">无</span>';

                document.getElementById('detail-content').innerHTML =
                    '<table style="margin-bottom:16px;">'
                    + row('ID', d.id)
                    + row('服务端', esc((d.serverIp || '-') + ':' + d.serverPort))
                    + row('客户端', esc((d.clientIp || '-') + ':' + d.clientPort))
                    + row('Topic', d.topicName ? esc(d.topicName) : '-')
                    + row('状态', successTag)
                    + row('重投递次数', d.retryCount)
                    + row('耗时', d.costMs != null ? d.costMs + 'ms' : '-')
                    + row('创建时间', esc(d.createdAt))
                    + '</table>'
                    + '<div style="margin-bottom:8px; font-size:12px; font-weight:500; color:var(--text-soft);">原始报文</div>'
                    + rawHtml
                    + (d.success ? '' : '<div style="margin:12px 0 8px; font-size:12px; font-weight:500; color:var(--text-soft);">错误信息</div>' + errorHtml);

                document.getElementById('detail-modal').classList.remove('hidden');
            });
    }

    function row(label, value) {
        return '<tr><td style="width:100px; font-weight:500; color:var(--text-muted); font-size:12px; white-space:nowrap;">' + label + '</td>'
             + '<td style="font-size:13px;">' + value + '</td></tr>';
    }

    function closeDetailModal() {
        document.getElementById('detail-modal').classList.add('hidden');
    }

    /* ========== 重投递 ========== */
    function resendLog(id) {
        if (!confirm('确定重投递日志 #' + id + ' 的原始报文？\n成功后该日志状态将更新为成功。')) return;
        fetch('/bridge-logs/' + id + '/resend', { method: 'POST' })
            .then(function (r) { return r.json(); })
            .then(function (j) {
                if (j.success) {
                    showToast('重投递成功，日志状态已更新', 'success');
                    loadStats();
                    loadData();
                } else {
                    showToast(j.reason || '重投递失败', 'error');
                }
            })
            .catch(function (err) {
                showToast('请求异常: ' + err.message, 'error');
            });
    }

    /* ========== 批量重投递 ========== */
    function batchResend() {
        if (!confirm('确定重投递所有失败日志？\n系统将分批查询并提交到虚拟线程池异步重投递，\n成功发送的日志状态将更新为成功。')) return;
        fetch('/bridge-logs/batch-resend', { method: 'POST' })
            .then(function (r) { return r.json(); })
            .then(function (j) {
                if (j.success) {
                    showToast(j.message || '重投递已提交', 'success');
                    loadStats();
                    loadData();
                } else {
                    showToast(j.reason || '重投递失败', 'error');
                }
            })
            .catch(function (err) {
                showToast('请求异常: ' + err.message, 'error');
            });
    }

    /* ========== 删除 ========== */
    function deleteLog(id) {
        if (!confirm('确定删除日志 #' + id + '？')) return;
        fetch('/bridge-logs/' + id, { method: 'DELETE' })
            .then(function (r) { return r.json(); })
            .then(function (j) {
                if (j.success) {
                    showToast('日志已删除', 'success');
                    loadStats();
                    loadData();
                } else {
                    showToast(j.reason || '删除失败', 'error');
                }
            });
    }

    /* ========== 工具 ========== */
    function esc(str) {
        if (str == null) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }
</script>
</body>
</html>
